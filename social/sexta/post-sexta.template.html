<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;font-family:Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#ffe3ec 0%,#fff3d9 55%,#dff3f8 100%);color:#49243d;position:relative;overflow:hidden}
.heart{position:absolute;color:#ffc9da;font-size:260px;right:-40px;top:-30px;transform:rotate(14deg)}
.brand{position:absolute;top:70px;left:80px;font:700 46px Georgia,serif}.brand i{color:#ed3f78;font-weight:400}
.tag{position:absolute;top:128px;left:82px;font-size:17px;letter-spacing:4px;color:#b14a73;font-weight:700}
h1{position:absolute;top:210px;left:80px;right:80px;font:500 112px/1.02 Georgia,serif;letter-spacing:-2px}
h1 em{color:#ed3f78}
p.sub{position:absolute;top:490px;left:80px;width:880px;font-size:41px;line-height:1.35;color:#6b3f59}
.ui{position:absolute;top:690px;left:80px;right:80px;background:#fff;border-radius:34px;box-shadow:0 30px 80px rgba(237,63,120,.22);padding:34px 36px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:2px solid #f3c6d6;border-radius:99px;padding:14px 26px;font-size:25px}
.chip.on{background:#ed3f78;border-color:#ed3f78;color:#fff;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:linear-gradient(135deg,#5ac2d5,#287d99);border-radius:22px;padding:24px;color:#fff;height:220px}
.card small{display:block;color:#ffe27a;font-size:17px;letter-spacing:2px;font-weight:700;margin-bottom:12px}
.card b{font:500 31px/1.15 Georgia,serif;display:block}
.card span{display:inline-block;margin-top:18px;border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:6px 14px;font-size:16px}
.cta{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#ed3f78;color:#fff;border-radius:99px;padding:26px 46px;font-size:34px;font-weight:700}
.at{font-size:28px;color:#6b3f59}
.sexta{position:absolute;top:160px;right:80px;background:#ffe27a;border-radius:99px;padding:14px 30px;font-size:26px;font-weight:800;transform:rotate(4deg)}
</style></head><body>
<div class="heart">♥</div>
<div class="brand">simple <i>&amp; romantic</i></div><div class="tag">SIMPLE MOMENTS · BEAUTIFUL MEMORIES</div>
<h1>Sem ideias<br>para <em>hoje?</em></h1>
<p class="sub">Descubra 3 ideias para você e seu par curtirem o fim de semana.</p>
<div class="ui"><div class="chips">{{CHIPS}}</div>
<div class="cards">{{CARDS}}</div></div>
<div class="cta"><div class="btn">Link na bio →</div><div class="at">simpleandromantic.com</div></div>
</body></html>
